<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>진로탐구 제출함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column console — sign-in card, then toolbar + submission list grouped by student */
:root{
  --bg:#eef3f3; --paper:#fff; --ink:#1f2a2c; --muted:#5f6d70; --line:#d3dcdd; --field:#f6f9f9;
  --teal:#3e9ca7; --accent:#2f8792; --new:#1f7a4d; --old:#8a9799; --danger:#c8322f; --yellow:#fee500;
  --display:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#141a1b;--paper:#1d2526;--ink:#e7eeee;--muted:#9fb0b2;--line:#36454a;--field:#232d2f;--accent:#6cc3cc;--new:#5fcf96;--old:#748487;color-scheme:dark}}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:900px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);margin:0}
h1 small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:8px;font-weight:400}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.login{max-width:380px;display:flex;flex-direction:column;gap:10px}
label{font-weight:700;font-size:13px}
input[type=password],input[type=search]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink);white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.small{font-size:12.5px;padding:5px 10px;font-weight:500}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{font-size:13.5px;color:var(--muted);min-height:20px}
.msg.err{color:var(--danger)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px;min-width:0}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-right:2px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.who{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.pill.new{color:var(--new)} .pill.old{color:var(--old)}
.item.isold .who{color:var(--muted);font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
.confirm{flex-wrap:wrap}
.confirm select{font:inherit;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.dlbox{font-size:13.5px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6;overflow-wrap:anywhere}
.dlbox a{color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.progress{height:6px;background:var(--field);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.years{display:flex;gap:6px;flex-wrap:wrap}
.ftabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin:-4px 0 4px}
.ftab{font:inherit;font-weight:700;font-size:16px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 18px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.ftab span{font-size:12px;font-weight:600;background:var(--line);color:var(--ink);border-radius:999px;padding:1px 8px}
.ftab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.year{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.year[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.year:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.classnav{display:flex;gap:6px;flex-wrap:wrap}
.classnav a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--field)}
.cls{border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:12px}
.cls>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--field)}
.cls>summary::-webkit-details-marker{display:none}
.cls>summary .ct{font-family:var(--display);font-size:20px}
.cls>summary .cn{font-size:13px;color:var(--muted);flex:1}
.cls>summary .arrow{color:var(--muted);transition:transform .15s}
.cls[open]>summary .arrow{transform:rotate(90deg)}
.cls .list{padding:0 12px}
.groups{display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){.item{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>보고서 제출함<small>선생님 전용</small></h1>
    <button class="btn" id="logoutBtn" type="button" hidden>잠그기</button>
  </header>

  <section class="card login" id="loginCard">
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="구글 스크립트에 넣은 비밀번호">
    <button class="btn primary" id="loginBtn" type="button">제출함 열기</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="main" hidden>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="ftabs" id="forms" role="tablist" aria-label="보고서 종류"></div>
      <div class="years" id="years" role="group" aria-label="연도"></div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input class="search" type="search" id="q" placeholder="이름이나 반으로 찾기 (예: 홍길동, 9탈레스)" aria-label="찾기">
        <label class="chk" hidden><input type="checkbox" id="onlyNew" checked> 학생별 최신 제출만</label>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
        <button class="btn primary" id="zipBtn" type="button">전체 받기</button>
      </div>
      <div class="progress" id="prog" hidden><i></i></div>
      <div class="msg" id="msg"></div>
      <div class="dlbox" id="dlbox" hidden></div>
      <div class="classnav" id="classnav"></div>
      <div class="groups" id="list"></div>
    </div>

    <div class="card" id="schoolCard" style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
      <h2 style="font-family:var(--display);font-weight:400;font-size:24px;margin:0">고등학교 자료 등록 <small style="font-family:var(--body);font-size:13px;color:var(--muted)">고등학교 조사 보고서용</small></h2>
      <p class="msg" style="margin:0">새 학교나 새 연도 공시 파일을 올리면 자동으로 정리돼요. 정리 결과를 확인·수정한 뒤 저장하면 학생 페이지 학교 목록에 바로 나와요. 같은 학교·같은 연도로 다시 저장하면 바뀌어요.</p>
      <div id="regList" class="msg">등록한 학교를 불러오는 중…</div>
      <div id="regUpload"></div>
      <div><button class="btn primary" id="regAnalyze" type="button">자동 정리하기</button></div>
      <div class="progress" id="regProg" hidden><i></i></div>
      <div class="msg" id="regMsg"></div>
      <div id="regEditor"></div>
      <div><button class="btn primary" id="regSave" type="button" hidden>원본 PDF 만들고 저장</button></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
const API="https://script.google.com/macros/s/AKfycbwPeH9jedalEe5H4_GrkgQHZ0YA6oruJCM4KHxNpoiw7iNFLr-0tSccUc5aEztzZ3Af/exec";
const $=id=>document.getElementById(id);
let KEY="", FILES=[];
try{KEY=sessionStorage.getItem("teacherKey")||"";}catch(e){}

async function api(params){
  const u=API+"?"+new URLSearchParams({...params,key:KEY,_:Date.now()});
  const r=await fetch(u); const j=await r.json();
  if(!j.ok) throw new Error(j.error||"fail");
  return j;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLASSES=["페르마","탈레스","유클리드","뉴튼","S가우스","칸토르","데카르트2"]; // 반 순서
function parse(f){ // "2학년3반_홍길동_1102_2130.pdf"
  let base=f.name.replace(/\.pdf$/i,"").replace(/_\d{4}_\d{4}$/,""), form="진로탐구보고서";
  const fi=base.indexOf("__"); if(fi>0){ form=base.slice(0,fi); base=base.slice(fi+2); }
  // "1학년_페르마반_홍길동" (예전 형식 "1학년1반_홍길동"도 읽음)
  const m=base.match(/^(\d*)\s*학년_?(.+?)반_(.*)$/);
  // 1·2·3학년 → 7·8·9학년, "9탈레스"·"탈레스"(학년 3 또는 9) → 모두 "9탈레스반"
  const normG=n=>{n=+n; return n>=1&&n<=3?n+6:n;};
  let g=99, c="기타", nm=base.replace(/_/g," ");
  if(m){ const raw=m[2].replace(/_/g,"").replace(/반$/,""), mm=raw.match(/^(\d+)(?:학년)?(.*)$/);
    const cn=(mm?mm[2]:raw).replace(/[a-z]/g,x=>x.toUpperCase()), gd=(mm&&mm[1])||m[1];
    g=gd?normG(gd):99; if(cn) c=cn; nm=(m[3]||"이름없음").replace(/_/g," "); }
  const ci=CLASSES.indexOf(c);
  const cls=c==="기타"?"기타":(g<99?g:"")+c+"반";
  return {...f,who:nm,key:form+"|"+cls+"|"+nm.replace(/\s/g,""),g,c,ci:ci<0?100:ci,cls,year:new Date(f.time).getFullYear(),form};
}
const fmtTime=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+"MB":Math.max(1,Math.round(b/1024))+"KB";

/* 로그인 */
/* 같은 학생이 여러 번 내면 마지막 것만 남기고 이전 것은 지움(구글 드라이브 휴지통으로) */
async function dedupe(){
  const groups={}; FILES.forEach(f=>{ const k=f.year+"|"+f.key; (groups[k]=groups[k]||[]).push(f); });
  const old=[]; Object.values(groups).forEach(g=>{ if(g.length>1){ g.sort((a,b)=>b.time-a.time); old.push(...g.slice(1)); } });
  if(!old.length) return;
  let done=0; $("msg").className="msg";
  for(const f of old){ $("msg").textContent="이전 제출 정리 중… ("+(done+1)+"/"+old.length+")";
    try{ await api({action:"delete",id:f.id}); FILES=FILES.filter(x=>x.id!==f.id); done++; }catch(e){} }
  $("msg").textContent="같은 학생이 다시 낸 "+done+"개는 마지막 제출로 덮어썼어요. (이전 파일은 구글 드라이브 휴지통에 30일 보관)";
}
async function login(){
  $("loginBtn").disabled=true; $("loginMsg").className="msg"; $("loginMsg").textContent="여는 중…";
  try{ const j=await api({action:"list"}); try{sessionStorage.setItem("teacherKey",KEY);}catch(e){}
    FILES=j.files.map(parse); $("loginCard").hidden=true; $("main").hidden=false; $("logoutBtn").hidden=false; render(); await dedupe(); render(); }
  catch(e){ $("loginMsg").className="msg err";
    $("loginMsg").textContent=e.message==="password"?"비밀번호가 맞지 않아요. 구글 스크립트에 넣은 비밀번호를 확인해 주세요.":"제출함에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
    try{sessionStorage.removeItem("teacherKey");}catch(_){} }
  finally{ $("loginBtn").disabled=false; }
}
$("loginBtn").addEventListener("click",()=>{KEY=$("pw").value.trim(); if(KEY) login();});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter"){KEY=$("pw").value.trim(); if(KEY) login();}});
$("logoutBtn").addEventListener("click",()=>{KEY="";FILES=[];try{sessionStorage.removeItem("teacherKey");}catch(e){} $("main").hidden=true;$("loginCard").hidden=false;$("logoutBtn").hidden=true;$("pw").value="";$("loginMsg").textContent="";});

/* 목록 */
let YEAR=null, FORM=null;
const BASEFORMS=["진로탐구보고서","고등학교조사보고서"];
const FORMNAME={"진로탐구보고서":"진로탐구 보고서","고등학교조사보고서":"고등학교 조사 보고서"};
function forms(){ const extra=[...new Set(FILES.map(f=>f.form))].filter(x=>!BASEFORMS.includes(x)).sort((a,b)=>a.localeCompare(b,"ko")); return BASEFORMS.concat(extra); }
const FF=()=>FILES.filter(f=>f.form===FORM);
function years(){ return [...new Set(FF().map(f=>f.year))].sort((x,y)=>y-x); }
function visible(){
  const q=$("q").value.replace(/\s/g,"");
  const latest={}; FILES.forEach(f=>{ const k=f.year+"|"+f.key; if(!latest[k]||latest[k].time<f.time) latest[k]=f; });
  return FF().filter(f=>f.year===YEAR).map(f=>({...f,isNew:latest[f.year+"|"+f.key]===f}))
    .filter(f=>(!$("onlyNew").checked||f.isNew)&&(!q||f.key.replace(/\s/g,"").includes(q)||f.cls.replace(/\s/g,"").includes(q)));
}
function byClass(v){
  const m=new Map(); v.forEach(f=>{ if(!m.has(f.cls)) m.set(f.cls,{g:f.cls==="기타"?999:f.g,ci:f.ci,c:f.c,files:[]}); m.get(f.cls).files.push(f); });
  return [...m.entries()].sort((a,b)=>a[1].g-b[1].g||a[1].ci-b[1].ci||a[1].c.localeCompare(b[1].c,"ko",{numeric:true}))
    .map(([cls,o])=>({cls,files:o.files.sort((x,y)=>x.g-y.g||x.who.localeCompare(y.who,"ko")||y.time-x.time)}));
}
function itemHtml(f){
  return '<div class="item'+(f.isNew?'':' isold')+'" data-id="'+f.id+'"><div><div class="who">'+esc(f.who)+'</div>'+
    '<div class="meta">'+(f.cls==="기타"?'<span>원래 이름: '+esc(f.name)+'</span>':'')+'<span>'+fmtTime(f.time)+' 제출</span><span>'+fmtSize(f.size)+'</span><span class="pill '+(f.isNew?'new">최신':'old">이전 제출')+'</span></div></div>'+
    '<div class="acts"><button class="btn small" data-act="open">열기</button><button class="btn small" data-act="dl">받기</button><button class="btn small" data-act="move">반 바꾸기</button><button class="btn small danger" data-act="del">삭제</button></div></div>';
}
const openState={};
function render(){
  const fs=forms(); if(!fs.includes(FORM)) FORM=fs[0]||"진로탐구보고서";
  $("forms").innerHTML=fs.map(x=>{ const n=new Set(FILES.filter(f=>f.form===x).map(f=>f.key)).size; return '<button type="button" class="ftab" role="tab" data-form="'+esc(x)+'" aria-selected="'+(x===FORM)+'">'+esc(FORMNAME[x]||x)+'<span>'+n+'명</span></button>'; }).join("");
  const ys=years(); if(!ys.includes(YEAR)) YEAR=ys[0]||new Date().getFullYear();
  $("years").innerHTML=(ys.length?ys:[YEAR]).map(y=>'<button type="button" class="year" data-year="'+y+'" aria-pressed="'+(y===YEAR)+'">'+y+'년</button>').join("");
  const inYear=FF().filter(f=>f.year===YEAR);
  const nStu=new Set(inYear.map(f=>f.key)).size, nCls=new Set(inYear.map(f=>f.cls)).size;
  $("stats").innerHTML='<span><b>'+nCls+'</b>개 반</span><span><b>'+nStu+'</b>명 제출</span><span><b>'+inYear.length+'</b>개 파일</span>';
  const groups=byClass(visible());
  $("classnav").innerHTML=groups.length>1?groups.map((g,i)=>'<a href="#cls'+i+'">'+esc(g.cls)+' '+new Set(g.files.map(f=>f.key)).size+'</a>').join(""):"";
  $("list").innerHTML=groups.length?groups.map((g,i)=>
    '<details class="cls" id="cls'+i+'" data-cls="'+esc(g.cls)+'"'+(openState[YEAR+g.cls]===false?'':' open')+'><summary><span class="arrow">▶</span><span class="ct">'+esc(g.cls)+'</span>'+
    '<span class="cn">'+new Set(g.files.map(f=>f.key)).size+'명 · 파일 '+g.files.length+'개</span>'+
    '<button class="btn small" type="button" data-zipcls="'+esc(g.cls)+'">이 반 전체 받기</button></summary>'+
    '<div class="list">'+g.files.map(itemHtml).join("")+'</div></details>'
  ).join(""):'<div class="empty">'+(inYear.length?"찾는 학생이 없어요.":"아직 제출한 학생이 없어요. 학생이 'PDF 만들고 제출'을 누르면 여기에 나타나요.")+'</div>';
  $("zipBtn").textContent=YEAR+"년 전체 받기"; $("zipBtn").disabled=!groups.length;
  if($("schoolCard")) $("schoolCard").hidden=FORM!=="고등학교조사보고서";
}
$("forms").addEventListener("click",e=>{const b=e.target.closest("[data-form]"); if(!b)return; FORM=b.dataset.form; YEAR=null; render();});
$("years").addEventListener("click",e=>{const b=e.target.closest("[data-year]"); if(!b)return; YEAR=+b.dataset.year; render();});
$("list").addEventListener("toggle",e=>{const d=e.target; if(d.classList&&d.classList.contains("cls")) openState[YEAR+d.dataset.cls]=d.open;},true);
$("q").addEventListener("input",render); $("onlyNew").addEventListener("change",render);
$("refreshBtn").addEventListener("click",async()=>{ $("refreshBtn").disabled=true; $("msg").className="msg"; $("msg").textContent="새로 불러오는 중…";
  try{ FILES=(await api({action:"list"})).files.map(parse); $("msg").textContent="최신 목록이에요 · "+fmtTime(Date.now()); await dedupe(); render(); }
  catch(e){ $("msg").className="msg err"; $("msg").textContent="불러오지 못했어요. 다시 눌러 주세요."; }
  finally{ $("refreshBtn").disabled=false; } });

async function getBlob(id){ const j=await api({action:"file",id});
  const bin=atob(j.pdf), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  let blob=new Blob([u8],{type:"application/pdf"});
  let name=j.name;
  if(/^고등학교조사보고서__/.test(j.name)){ const r=await withOriginals(u8,blob); blob=r.blob;
    name=j.name.replace(/^고등학교조사보고서__\d+학년_/,"").replace(/_\d{4}_\d{4}\.pdf$/i,"").replace(/\.pdf$/i,"")+(r.school?"_"+r.school:"")+".pdf"; }
  return {blob,name}; }
/* 고등학교 조사 보고서: 학생이 낸 4쪽 뒤에 선생님 쪽에 있는 학교 원본(평가계획·특색사업)을 붙임 */
const DOCS={};
function b64u8(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function docOf(key,get){ if(!DOCS[key]) DOCS[key]=get().catch(e=>{ delete DOCS[key]; throw e; }); return DOCS[key]; }
async function origBytes(m,which){
  if(m.src==="b"){ const path=which==="ev"?m.doc:m.fdoc; if(!path) return null;
    return docOf(path,async()=>{ const r=await fetch(path); if(!r.ok) throw new Error("doc"); return new Uint8Array(await r.arrayBuffer()); }); }
  if(m.src==="r"){ const id=which==="ev"?m.ev:m.ft; if(!id) return null;
    return docOf(id,async()=>{ const r=await fetch(API+"?action=schooldoc&id="+encodeURIComponent(id)); const j=await r.json(); if(!j.ok) throw new Error("doc"); return b64u8(j.pdf); }); }
  return null;
}
async function withOriginals(u8,blob){ let school="";
  const R=b=>({blob:b,school});
  if(!window.PDFLib) return R(blob);
  try{
    const mine=await PDFLib.PDFDocument.load(u8,{updateMetadata:false});
    const mt=String(mine.getKeywords()||"").match(/FERMAT_SCHOOL:(\S+)/); if(!mt) return R(blob); // 예전 제출(원본이 이미 들어 있음)
    const m=JSON.parse(decodeURIComponent(mt[1])); school=String(m.name||"").replace(/[\\/:*?"<>|]/g,"");
    const out=await PDFLib.PDFDocument.create(); out.setTitle("고등학교 조사 보고서 (원본 포함)");
    const docs={};
    for(const w of ["ev","ft"]){ try{ const b=await origBytes(m,w); if(b) docs[w]=await PDFLib.PDFDocument.load(b,{ignoreEncryption:true}); }catch(e){} }
    if(!docs.ev&&!docs.ft) return R(blob);
    const heads=await out.copyPages(mine,mine.getPageIndices());
    const evP=docs.ev?await out.copyPages(docs.ev,docs.ev.getPageIndices()):[], ftP=docs.ft?await out.copyPages(docs.ft,docs.ft.getPageIndices()):[];
    if(m.plan){ // 과목 첫 쪽 뒤에 그 과목 원본을 끼워 넣기
      String(m.plan).split(",").forEach(t=>{
        if(/^\d+$/.test(t)){ if(heads[+t]) out.addPage(heads[+t]); return; }
        const g=t.match(/^([ef])(\d+)-(\d+)$/); if(!g) return; const src=g[1]==="e"?evP:ftP;
        for(let i=+g[2];i<=+g[3];i++) if(src[i-1]) out.addPage(src[i-1]); });
    }else{ heads.forEach(p=>out.addPage(p)); evP.forEach(p=>out.addPage(p)); ftP.forEach(p=>out.addPage(p)); }
    const font=await out.embedFont(PDFLib.StandardFonts.Helvetica), N=out.getPageCount();
    out.getPages().forEach((pg,i)=>{ if(i===0) return; const t=(i+1)+" / "+N, w=font.widthOfTextAtSize(t,9), sz=pg.getSize();
      pg.drawRectangle({x:sz.width/2-w/2-6,y:3,width:w+12,height:13,color:PDFLib.rgb(1,1,1),opacity:0.85});
      pg.drawText(t,{x:sz.width/2-w/2,y:6.5,size:9,font,color:PDFLib.rgb(0.35,0.35,0.35)}); });
    return R(new Blob([await out.save()],{type:"application/pdf"}));
  }catch(e){ return R(blob); }
}
function saveBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),600000);
  // 브라우저가 자동 다운로드를 막는 경우를 위해, 직접 누를 수 있는 링크도 보여줌
  const box=$("dlbox"); box.hidden=false;
  box.innerHTML='⬇️ <b>'+esc(name)+'</b> 다운로드를 시작했어요. 다운로드 폴더를 확인하세요.<br>안 받아졌으면 <a href="'+u+'" download="'+esc(name)+'">여기를 눌러 받기</a>';
}

$("list").addEventListener("click",async e=>{
  const z=e.target.closest("[data-zipcls]"); if(z){ e.preventDefault(); const cls=z.dataset.zipcls; zipFiles(visible().filter(f=>f.cls===cls),FORM+"_"+YEAR+"년_"+cls.replace(/\s/g,""),false,z); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const item=b.closest(".item"), id=item.dataset.id, f=FILES.find(x=>x.id===id); if(!f) return;
  const act=b.dataset.act;
  if(act==="del"){ item.querySelector(".acts").innerHTML='<span class="confirm">지울까요? <button class="btn small danger" data-act="delYes">지우기</button><button class="btn small" data-act="delNo">취소</button></span>'; return; }
  if(act==="delNo"){ render(); return; }
  if(act==="move"){
    item.querySelector(".acts").innerHTML='<span class="confirm"><select data-mg aria-label="학년">'+[7,8,9].map(g=>'<option'+(g===f.g?' selected':'')+'>'+g+'</option>').join("")+'</select>'+
      '<select data-mc aria-label="반">'+[...CLASSES,...[...new Set(FILES.map(x=>x.c))].filter(c=>c!=="기타"&&!CLASSES.includes(c)).sort((x,y)=>x.localeCompare(y,"ko",{numeric:true}))].map(c=>'<option'+(c===f.c?' selected':'')+'>'+c+'</option>').join("")+'</select>반 '+
      '<button class="btn small" data-act="moveYes">옮기기</button><button class="btn small" data-act="delNo">취소</button></span>'; return; }
  if(act==="moveYes"){
    const g=item.querySelector("[data-mg]").value, c=item.querySelector("[data-mc]").value;
    const label=(f.form!=="진로탐구보고서"?f.form+"__":"")+g+"학년_"+g+c+"반_"+f.who.replace(/\s+/g,"");
    b.disabled=true; b.textContent="옮기는 중…"; $("msg").className="msg";
    try{
      const j=await api({action:"file",id});
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({label,pdf:j.pdf})});
      const k=await r.json(); if(!k.ok) throw new Error(k.error||"fail");
      await api({action:"delete",id});
      FILES=(await api({action:"list"})).files.map(parse); await dedupe(); render();
      $("msg").textContent=f.who+" 학생을 "+g+c+"반으로 옮겼어요.";
    }catch(_){ $("msg").className="msg err"; $("msg").textContent="옮기지 못했어요. 새로고침 후 다시 해 주세요."; render(); }
    return; }
  if(act==="delYes"){ b.disabled=true; try{ await api({action:"delete",id}); FILES=FILES.filter(x=>x.id!==id); render(); $("msg").className="msg"; $("msg").textContent=f.who+" 파일을 지웠어요. (구글 드라이브 휴지통에서 30일 안에 되살릴 수 있어요)"; }
    catch(_){ $("msg").className="msg err"; $("msg").textContent="지우지 못했어요. 다시 해 주세요."; render(); } return; }
  // 열기: 새 창을 먼저 열어 두어야 팝업 차단을 피할 수 있어요
  const win=act==="open"?window.open("","_blank"):null;
  if(win) win.document.write('<p style="font-family:sans-serif;padding:20px">'+esc(f.who)+' 보고서를 여는 중…</p>');
  b.disabled=true; const old=b.textContent; b.textContent="여는 중…";
  try{ const {blob,name}=await getBlob(id);
    if(act==="open"){ const u=URL.createObjectURL(blob); if(win) win.location.href=u; else window.open(u,"_blank"); }
    else saveBlob(blob,name); }
  catch(_){ if(win) win.close(); $("msg").className="msg err"; $("msg").textContent="파일을 가져오지 못했어요. 다시 눌러 주세요."; }
  finally{ b.disabled=false; b.textContent=old; }
});

/* 압축해서 받기: 연도 전체(반별 폴더) / 반 전체 */
async function zipFiles(v,label,folders,btn){
  if(!v.length) return;
  if(!window.JSZip){ $("msg").className="msg err"; $("msg").textContent="압축 도구를 불러오지 못했어요. 새로고침 후 다시 해 주세요."; return; }
  btn.disabled=true; $("prog").hidden=false; const bar=$("prog").firstElementChild; $("msg").className="msg";
  const zip=new JSZip(); let fail=0;
  for(let i=0;i<v.length;i++){
    $("msg").textContent="파일 모으는 중… ("+(i+1)+"/"+v.length+") "+v[i].cls+" "+v[i].who; bar.style.width=(i/v.length*100)+"%";
    try{ const {blob,name}=await getBlob(v[i].id); (folders?zip.folder(v[i].cls.replace(/\s/g,"")):zip).file(name,blob); }catch(e){ fail++; }
  }
  bar.style.width="100%"; $("msg").textContent="압축하는 중…";
  const zname=(label.indexOf(FORM)===0?"":FORM+"_")+label+".zip";
  saveBlob(await zip.generateAsync({type:"blob"}),zname);
  $("msg").textContent=(v.length-fail)+"개 파일을 "+zname+"로 받았어요."+(fail?" ("+fail+"개는 가져오지 못했어요)":"");
  $("prog").hidden=true; bar.style.width="0"; btn.disabled=false;
}
$("zipBtn").addEventListener("click",()=>zipFiles(visible(),FORM+"_"+YEAR+"년_전체",true,$("zipBtn")));

if(KEY) login(); else $("pw").focus();
})();
</script>

<script src="school-kit.js?v=5"></script>

const key=()=>{try{return sessionStorage.getItem("teacherKey")||"";}catch(e){return "";}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let RES=null, UP=null, LOGO="";
$("regUpload").innerHTML=SchoolKit.uploadHtml("regUp");
const msg=(t,err)=>{$("regMsg").className="msg"+(err?" err":""); $("regMsg").textContent=t;};
async function loadList(){
  try{ const r=await fetch(API+"?action=schools&_="+Date.now()); const j=await r.json();

    if(!j.schools.length){ $("regList").textContent="아직 등록한 학교가 없어요. (기본 11개 학교는 페이지에 들어 있어요)"; return; }

  }catch(e){ $("regList").textContent="등록한 학교 목록을 불러오지 못했어요."; }

$("regList").addEventListener("click",async e=>{ const b=e.target.closest("[data-delreg]"); if(!b) return;
  if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="정말 삭제?"; return; }

new MutationObserver(()=>{ if(!$("main").hidden&&$("regList").dataset.loaded!=="1"){ $("regList").dataset.loaded="1"; loadList(); } }).observe($("main"),{attributes:true});
$("regAnalyze").addEventListener("click",async()=>{
  UP=SchoolKit.readUpload($("regUp"));

  }catch(e){ msg("정리하지 못했어요: "+(e.message||e),true); }
  finally{ $("regAnalyze").disabled=false; }
});
async function post(body){ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); const j=await r.json(); if(!j.ok) throw new Error(j.error==="password"?"비밀번호가 맞지 않아요":j.error||"저장 실패"); }
